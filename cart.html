<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EasyBuy Cart</title>
  <style>
    :root {
      --primary: #4c61ad;
      --secondary: #1a84bd;
      --accent: #65d2f0;
      --bg: #17273f;
      --surface: rgba(255, 255, 255, 0.12);
      --surface-strong: rgba(255, 255, 255, 0.25);
      --border: rgba(255, 255, 255, 0.16);
      --text: #eef2ff;
      --muted: rgba(255, 255, 255, 0.75);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: radial-gradient(circle at top left, rgba(100, 162, 255, 0.18), transparent 28%),
        radial-gradient(circle at bottom right, rgba(255, 129, 196, 0.12), transparent 30%),
        linear-gradient(180deg, #0f1a2e 0%, #1d3550 100%);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    header {
      background: rgba(255, 255, 255, 0.08);
      color: white;
      padding: 22px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(18px);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    nav a {
      color: rgba(255, 255, 255, 0.85);
      text-decoration: none;
      margin-left: 20px;
      font-size: 0.95rem;
      transition: color 0.2s ease;
    }

    nav a:hover {
      color: white;
    }

    .container {
      width: min(1100px, 92%);
      margin: 0 auto;
      padding: 40px 0 60px;
    }

    .cart-panel {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid var(--border);
      border-radius: 32px;
      padding: 32px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.16);
      backdrop-filter: blur(20px);
      margin-top: 32px;
    }

    .cart-panel h2 {
      margin-bottom: 18px;
      color: white;
      font-size: 1.8rem;
    }

    .cart-list {
      list-style: none;
      margin-bottom: 20px;
    }

    .cart-list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 16px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 12px;
      color: white;
    }

    .cart-list button {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      color: #d8e7ff;
      padding: 8px 14px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .cart-list button:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    .cart-total {
      display: flex;
      justify-content: space-between;
      font-weight: 700;
      font-size: 1.15rem;
      margin-bottom: 22px;
      color: white;
    }

    .cart-panel button.checkout {
      width: 100%;
      padding: 16px;
      border: none;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border-radius: 18px;
      cursor: pointer;
      font-weight: 700;
      letter-spacing: 0.01em;
      transition: transform 0.2s ease;
    }

    .cart-panel button.checkout:hover {
      transform: translateY(-2px);
    }

    footer {
      text-align: center;
      padding: 24px 30px;
      color: rgba(255, 255, 255, 0.75);
      font-size: 0.95rem;
    }

    @media (max-width: 600px) {
      header {
        justify-content: center;
      }

      nav {
        margin-top: 14px;
      }

      .cart-list li {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">EasyBuy</div>
    <nav>
      <a href="frontend.html">Home</a>
      <a href="shopping.html">Shop</a>
      <a href="cart.html">Cart <span id="cartCount"></span></a>
      <a href="login.html">Login</a>
    </nav>
  </header>

  <main class="container">
    <section class="cart-panel">
      <h2>Your Cart</h2>
      <ul class="cart-list" id="cartList">
        <li>No items in the cart yet.</li>
      </ul>
      <div class="cart-total">
        <span>Total</span>
        <span id="cartTotal">$0.00</span>
      </div>
      <button class="checkout" onclick="checkout()">Checkout</button>
    </section>
  </main>

  <footer>
    Made with HTML, CSS, and JavaScript for a simple shopping front end.
  </footer>

  <script>
    const CART_STORAGE_KEY = 'easybuyCart';

    function loadCart() {
      return JSON.parse(localStorage.getItem(CART_STORAGE_KEY) || '[]');
    }

    function saveCart(cart) {
      localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(cart));
    }

    function updateCartCount() {
      const cart = loadCart();
      const count = cart.reduce((sum, item) => sum + item.quantity, 0);
      const countElement = document.getElementById('cartCount');
      if (countElement) {
        countElement.textContent = count ? `(${count})` : '';
      }
    }

    function renderCart() {
      const cart = loadCart();
      const list = document.getElementById('cartList');
      list.innerHTML = '';

      if (cart.length === 0) {
        list.innerHTML = '<li>No items in the cart yet.</li>';
      } else {
        cart.forEach(item => {
          const li = document.createElement('li');
          li.innerHTML = `
            <span>${item.name} x${item.quantity}</span>
            <span>$${(item.price * item.quantity).toFixed(2)} <button onclick="removeFromCart('${item.id}')">Remove</button></span>
          `;
          list.appendChild(li);
        });
      }

      const total = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
      document.getElementById('cartTotal').textContent = `$${total.toFixed(2)}`;
      updateCartCount();
    }

    function removeFromCart(id) {
      const cart = loadCart();
      const index = cart.findIndex(item => item.id === id);
      if (index !== -1) {
        cart.splice(index, 1);
        saveCart(cart);
      }
      renderCart();
    }

    function checkout() {
      const cart = loadCart();
      if (cart.length === 0) {
        alert('Your cart is empty. Add items to checkout.');
        return;
      }
      window.location.href = 'payment.html';
    }

    renderCart();
  </script>
</body>
</html>
